// Creates or updates a standard message document.
// The purpose of APP-11 is to provide user’s with definitive reference of
// messages and supporting tables mandated for use in Joint, Land, Maritime and
// Air Operations.
// It is a compendium of formatted, structured and voice general purpose
// messages for command and control of NATO forces at all levels of the Chain of
// Command down to and including individual units. The formatted messages of
// APP-11 are taken from the ADatP-03 database published in form of a baseline.
// The latest version of the APP-11 catalogue consists of over 400 messages
// covering every aspect of NATO operations
message UpdateNatoMessageDocument {
  // Required: The unique identity of the standard message document. 
  Identity identity = 1;
  // Required: The ID of the reporter who generated the changes. Will be
  // obtainable via a the interface later on. For now, use the value you get
  // from Rheinmetall - use "TacticalAPI" if in doubt. 
  Identity reporter = 2;
  // Required: Time of changes. Only the most up-to-date information is
  // considered, so use the current UTC time for new changes but make sure to
  // use the same timestamp as before when nothing changed.
  google.protobuf.Timestamp reporting_time = 3;    
  // Expiry timestamp of the standard message document. Expired standard message
  // document are automatically marked as deleted and removed from the map. It's
  // possible to extend this time. 
  UpdatePropertyTimestamp expiry_time = 4;    
  // A foreign key for mediation between external systems/interfaces, some
  // external interfaces also create their own ID for added objects.
  UpdatePropertyIdentity foreign_key = 5;
  // The location here should be one of the locations from the standard message.
  // Not necessary, only shows a marker on map without parsing the MTF message
  // for example.
  UpdatePropertyLocation location = 6;
  // Name of the standard message document.
  UpdatePropertyString name = 7;
  // Addition information for the standard message document.
  UpdatePropertyString additional_information = 8;

  // The APP11 Message Text Formats (MTF)
  UpdatePropertyString mtf_message_data = 20;
  // The message category of the standard message document like normal, private,
  // warning or operational.
  UpdatePropertyMessageCategory message_category = 21;
  // The message precedence of the standard message document like routine,
  // flash, normal or immediate.
  UpdatePropertyMessagePrecedence message_precedence = 22;    
}

