// A standard message document.
// The purpose of APP-11 is to provide user’s with definitive reference of
// messages and supporting tables mandated for use in Joint, Land, Maritime and
// Air Operations.
// It is a compendium of formatted, structured and voice general purpose
// messages for command and control of NATO forces at all levels of the Chain of
// Command down to and including individual units. The formatted messages of
// APP-11 are taken from the ADatP-03 database published in form of a baseline.
// The latest version of the APP-11 catalogue consists of over 400 messages
// covering every aspect of NATO operations.
message NatoMessageDocument {
  // The fix unique identity of the standard message document.
  Identity identity = 1;
  // The fix creation meta data of the object like creation date time and the
  // creating reporter ID.
  CreationMetaData creation_meta_data = 2;        
  // Dictionary of additional attributes created by the underlying service, like
  // type of symbol, distance or direction to own position. For more information
  // see 'AdditionalAttributeValue'.
  map<string, AdditionalAttributeValue> additional_attributes = 5;
  // Expiry timestamp of the standard message document. Expired action task
  // automatically marked as deleted. It's possible to extend this time. 
  DataPropertyTimestamp expiry_time = 6;
  // Dictionary of foreign keys for mediation between external
  // systems/interfaces, some external interfaces also create their own ID for
  // added objects.
  map<string, DataPropertyIdentity> foreign_keys = 7;
  // The location here should be one of the locations from the standard message.
  // Not necessary, only shows a marker on map without parsing the MTF message
  // for example.
  DataPropertyLocation location = 8;    
  // Name of the standard message document.
  DataPropertyString name = 9;
  // Additional information for the standard message document.
  DataPropertyString additional_information = 10;    

  // The APP11 Message Text Formats (MTF)
  DataPropertyString mtf_message_data = 20;
  // The message category of the standard message document like normal, private,
  // warning or operational.
  DataPropertyMessageCategory message_category = 21;
  // The message precedence of the standard message document like routine,
  // flash, normal or immediate.
  DataPropertyMessagePrecedence message_precedence = 22;    
}

// A overlay document that contains a list of situation objects.
message OverlayDocument {
  // The fix unique identity of the overlay document.
  Identity identity = 1;
  // The fix creation meta data of the object like creation date time and the
  // creating reporter ID.
  CreationMetaData creation_meta_data = 2;      
  // Dictionary of additional attributes created by the underlying service, like
  // type of symbol, distance or direction to own position. For more information
  // see 'AdditionalAttributeValue'.
  map<string, AdditionalAttributeValue> additional_attributes = 5;
  // Expiry timestamp of the overlay document. Expired overlay document
  // automatically marked as deleted. It's possible to extend this time. 
  DataPropertyTimestamp expiry_time = 6;
  // Dictionary of foreign keys for mediation between external
  // systems/interfaces, some external interfaces also create their own ID for
  // added objects.
  map<string, DataPropertyIdentity> foreign_keys = 7;    
  // The name of the overlay document.
  DataPropertyString name = 9;
  // Additional information for the overlay document.
  DataPropertyString additional_information = 10;    

  // A two-digit tag for the overlay to describe the overlay symbols on the map.
  DataPropertyString tag = 20;   
  // The contained overlay situation objects.
  DataPropertySituationObjects overlay_data = 23;
  // The message category of the overlay document like normal, private, warning
  // or operational.
  DataPropertyMessageCategory message_category = 24;
  // The message precedence of the overlay document like routine, flash, normal
  // or immediate.
  DataPropertyMessagePrecedence message_precedence = 25;    
}
