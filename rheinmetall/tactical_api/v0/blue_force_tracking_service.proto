syntax = "proto3";

package rheinmetall.tactical_api.v0;

import "rheinmetall/tactical_api/v0/blue_force_types.proto";
import "rheinmetall/tactical_api/v0/service_types.proto";

// Allow to track blue forces.
// A blue force is a friendly participant updating its position on its own.
service BlueForceTracking {
  // Can be used to get updates when blue forces change.
  // Initially, all existing blue forces are returned
  // for every call.
  rpc SubscribeBlueForceEvents(SubscribeBlueForceEventsRequest)
      returns (stream SubscribeBlueForceEventsResponse) {
  }

  // Returns all the blue forces currently available.
  rpc GetBlueForces(GetBlueForcesRequest)
      returns (GetBlueForcesResponse) {
  } 
 
  // Adds or updates a blue force.
  // To make sure a blue force is not deleted this method needs to be called
  // cyclically at least every 30s. 
  // Deletion is done implicitly when a timeout defined by the application is reached.
  // In contrast to the UpdateSituationObject message all fields must be filled
  // in every call since blue forces are usually not updated by two systems at
  // the same time.
  rpc AddOrUpdateBlueForces(AddOrUpdateBlueForcesRequest)
      returns (AddOrUpdateBlueForcesResponse) {
  }
}

// Reserved for future use.
message SubscribeBlueForceEventsRequest {
}

// Blue forces for streaming use.
message SubscribeBlueForceEventsResponse {
  // Specifies if the command was successful.
  rheinmetall.tactical_api.v0.ResponseHeader header = 1;
  // The returned blue forces.
  repeated BlueForce updated_blue_forces = 2;  
}

// Reserved for future use.
message GetBlueForcesRequest {
}

// Contains all blue forces currently.
message GetBlueForcesResponse {
  // Specifies if the command was successful.
  rheinmetall.tactical_api.v0.ResponseHeader header = 1;
  // The returned blue forces.
  repeated BlueForce blue_forces = 2;
}

// Specifies the blue forces to be added or updated. 
message AddOrUpdateBlueForcesRequest {
  // The blue forces.
  repeated UpdateBlueForce blue_forces_to_updates = 2;
}

// Specifies if AddOrUpdateBlueForces was successful.
message AddOrUpdateBlueForcesResponse {
  // Specifies if the command was successful.
  rheinmetall.tactical_api.v0.ResponseHeader header = 1;
}
